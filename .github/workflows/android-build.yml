name: Build Hefzyar APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: |
          sdkmanager --list --channel=3 | grep -E "platforms;android-37|android-37"
      - name: Find uploaded Hefzyar ZIP
        run: |
          ZIP=$(find . -maxdepth 2 -type f -name "*.zip" | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "Hefzyar ZIP was not found."
            exit 1
          fi
          echo "Found: $ZIP"
          mkdir -p buildsrc
          unzip -q "$ZIP" -d buildsrc

      - name: Locate Android project
        run: |
          ROOT=$(find buildsrc -type f -name "settings.gradle.kts" -printf '%h\n' | head -n 1)
          if [ -z "$ROOT" ]; then
            echo "settings.gradle.kts was not found."
            find buildsrc -maxdepth 4 -type f | head -100
            exit 1
          fi
          echo "PROJECT_ROOT=$ROOT" >> "$GITHUB_ENV"
          echo "Project root: $ROOT"
      - name: Show problematic source files
        run: |
            echo "===== MemorizationFlow.kt ====="
            sed -n '1,80p' "$PROJECT_ROOT/app/src/main/java/ir/hefzyar/app/domain/memorization/MemorizationFlow.kt"

            echo "===== QuranImportPipeline.kt ====="
            sed -n '1,100p' "$PROJECT_ROOT/app/src/main/java/ir/hefzyar/app/domain/quran/importer/QuranImportPipeline.kt"

            echo "===== QuranImportValidator.kt ====="
            sed -n '1,100p' "$PROJECT_ROOT/app/src/main/java/ir/hefzyar/app/domain/quran/importer/QuranImportValidator.kt"

            echo "===== HomeScreen.kt ====="
            sed -n '55,80p' "$PROJECT_ROOT/app/src/main/java/ir/hefzyar/app/feature/home/HomeScreen.kt"
      - name: Fix KSP version
        run: |
         sed -i 's/2.4.10-2.0.2/2.3.10/g' "$PROJECT_ROOT/build.gradle.kts" "$PROJECT_ROOT/app/build.gradle.kts" 
         sed -i 's/compileSdk = 36/compileSdk = 37/g' "$PROJECT_ROOT/app/build.gradle.kts" 
      - name: Fix Kotlin compiler options
        run: |
          sed -i '/kotlinOptions[[:space:]]*{/,/^[[:space:]]*}/c\
              kotlin {\
                  compilerOptions {\
                      jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.fromTarget("17")\
                  }\
              }' "$PROJECT_ROOT/app/build.gradle.kts"
      
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.6.0'
      - name: Fix Android theme
        run: |
          mkdir -p "$PROJECT_ROOT/app/src/main/res/values"
          cat >> "$PROJECT_ROOT/app/src/main/res/values/hefzyar_theme_fix.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.Material3.DayNight.NoActionBar" parent="@android:style/Theme.Material.Light.NoActionBar" />
          </resources>
          EOF
      - name: Build Debug APK
        run: |
          cd "$PROJECT_ROOT"
          gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Hefzyar-debug-apk
          path: |
            buildsrc/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
